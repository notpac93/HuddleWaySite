name: CRM release gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backend_contract_ref:
        description: Full HuddleWay backend contract commit SHA
        required: true
        type: string
      consumer_release_id:
        description: Separately deployed consumer-app release ID, when /app is referenced
        required: false
        type: string
      consumer_artifact_sha256:
        description: SHA-256 of the separately deployed consumer-app artifact
        required: false
        type: string
      consumer_rollback_release_id:
        description: Previously accepted consumer-app release ID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: crm-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    name: Deterministic CRM release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUDDLEWAY_RELEASE_ENVIRONMENT: production-candidate
      HUDDLEWAY_BACKEND_ROOT: ${{ github.workspace }}/.release-input/HuddleWay
      HUDDLEWAY_BACKEND_CONTRACT_REF: ${{ inputs.backend_contract_ref || vars.HUDDLEWAY_BACKEND_CONTRACT_REF }}
      HUDDLEWAY_CONSUMER_RELEASE_ID: ${{ inputs.consumer_release_id || vars.HUDDLEWAY_CONSUMER_RELEASE_ID }}
      HUDDLEWAY_CONSUMER_ARTIFACT_SHA256: ${{ inputs.consumer_artifact_sha256 || vars.HUDDLEWAY_CONSUMER_ARTIFACT_SHA256 }}
      HUDDLEWAY_CONSUMER_OWNER: huddleway-app-release
      HUDDLEWAY_CONSUMER_ROLLBACK_RELEASE_ID: ${{ inputs.consumer_rollback_release_id || vars.HUDDLEWAY_CONSUMER_ROLLBACK_RELEASE_ID }}
      HUDDLEWAY_RELEASE_BACKEND_URL: https://api.huddleway.com
      HUDDLEWAY_RELEASE_FIREBASE_PROJECT_ID: sports-team-apps
      HUDDLEWAY_RELEASE_FIREBASE_USE_EMULATORS: "false"
      PUBLIC_FIREBASE_APP_CHECK_ENABLED: "true"
      PUBLIC_FIREBASE_APP_CHECK_SITE_KEY: ${{ secrets.PUBLIC_FIREBASE_APP_CHECK_SITE_KEY }}
      PUBLIC_WEBSITE_COMMIT: ${{ github.sha }}
      HUDDLEWAY_FIREBASE_APP_CHECK_SITE_KEY_SHA256: ${{ vars.HUDDLEWAY_FIREBASE_APP_CHECK_SITE_KEY_SHA256 }}
      CI: "true"

    steps:
      - name: Check out website source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require pinned backend contract revision
        run: |
          if [[ ! "$HUDDLEWAY_BACKEND_CONTRACT_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Configure HUDDLEWAY_BACKEND_CONTRACT_REF as a full reviewed commit SHA."
            exit 1
          fi
          if [[ -z "$PUBLIC_FIREBASE_APP_CHECK_SITE_KEY" ]]; then
            echo "::error::Configure the PUBLIC_FIREBASE_APP_CHECK_SITE_KEY repository secret."
            exit 1
          fi
          if [[ ! "$HUDDLEWAY_FIREBASE_APP_CHECK_SITE_KEY_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Configure HUDDLEWAY_FIREBASE_APP_CHECK_SITE_KEY_SHA256 with the approved site-key hash."
            exit 1
          fi

      - name: Check out authoritative backend contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: notpac93/HuddleWay
          ref: ${{ env.HUDDLEWAY_BACKEND_CONTRACT_REF }}
          path: .release-input/HuddleWay
          fetch-depth: 1
          token: ${{ secrets.HUDDLEWAY_BACKEND_READ_TOKEN || github.token }}

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up pinned npm
        run: npm install --global npm@11.5.2

      - name: Install locked dependencies
        run: npm ci

      - name: Run release gates and produce attested artifact
        run: npm run release:ci

      - name: Publish release evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crm-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/
            .release/crm-release-manifest.json

      - name: Publish failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crm-release-failure-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            playwright-report/
            test-results/
            .release/crm-release-manifest.json

      - name: Write release summary
        if: always()
        run: |
          {
            echo "## CRM release gate"
            echo
            echo "- Website commit: \`${GITHUB_SHA}\`"
            echo "- Backend contract: \`${HUDDLEWAY_BACKEND_CONTRACT_REF:-missing}\`"
            echo "- Environment: \`${HUDDLEWAY_RELEASE_ENVIRONMENT}\`"
            if [[ -f .release/crm-release-manifest.json ]]; then
              node -e "const m=require('./.release/crm-release-manifest.json'); console.log('- Artifact SHA-256: \`'+m.artifact.sha256+'\`')"
            else
              echo "- Artifact: not produced; inspect the failed gate above"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
