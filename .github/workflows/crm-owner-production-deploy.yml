name: CRM owner production deployment

on:
  workflow_dispatch:
    inputs:
      website_ref:
        description: Full HuddleWaySite commit SHA with a successful CRM release-gate artifact
        required: true
        type: string
      release_run_id:
        description: Successful CRM release-gate run ID for website_ref
        required: true
        type: string
      rollback_ref:
        description: Current porkbun-huddleway-static full commit SHA
        required: true
        type: string
      owner_confirmation:
        description: Type APPROVE_OWNER_PRODUCTION_DEPLOYMENT to confirm this single-owner release
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: porkbun-huddleway-static-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Promote exact release-gate artifact with owner approval
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_TARGET: porkbun-huddleway-static
      PRODUCTION_ORIGIN: https://huddleway.com
      BACKEND_HEALTH_URL: https://api.huddleway.com/health
      WEBSITE_REF: ${{ inputs.website_ref }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      ROLLBACK_REF: ${{ inputs.rollback_ref }}
      OWNER_CONFIRMATION: ${{ inputs.owner_confirmation }}
      RELEASE_INPUT_DIR: ${{ github.workspace }}/.release/owner-input
      STATIC_TARGET_DIR: ${{ github.workspace }}/.release/static-target
      DEPLOYMENT_PUSHED: "false"

    steps:
      - name: Require explicit owner approval and immutable inputs
        run: |
          if [[ "$OWNER_CONFIRMATION" != "APPROVE_OWNER_PRODUCTION_DEPLOYMENT" ]]; then
            echo "::error::Owner confirmation is required."
            exit 1
          fi
          for value in "$WEBSITE_REF" "$ROLLBACK_REF"; do
            if [[ ! "$value" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::Website and rollback refs must be full commit SHAs."
              exit 1
            fi
          done
          if [[ ! "$RELEASE_RUN_ID" =~ ^[1-9][0-9]{5,19}$ ]]; then
            echo "::error::release_run_id must be a GitHub Actions run ID."
            exit 1
          fi
          if [[ "${GITHUB_SHA,,}" != "${WEBSITE_REF,,}" ]]; then
            echo "::error::Dispatch this workflow from the exact approved website commit."
            exit 1
          fi

      - name: Check out exact deployment implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.website_ref }}
          fetch-depth: 1

      - name: Verify successful source-bound release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
          head_sha="$(node -e "const r=JSON.parse(process.argv[1]); process.stdout.write(String(r.head_sha || '').toLowerCase())" "$run_json")"
          conclusion="$(node -e "const r=JSON.parse(process.argv[1]); process.stdout.write(String(r.conclusion || ''))" "$run_json")"
          if [[ "$head_sha" != "${WEBSITE_REF,,}" || "$conclusion" != "success" ]]; then
            echo "::error::The named release-gate run is not a successful build of website_ref."
            exit 1
          fi

      - name: Download exact release artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: crm-release-${{ inputs.website_ref }}
          path: ${{ env.RELEASE_INPUT_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}

      - name: Verify the artifact manifest and every staged file
        run: |
          node - "$RELEASE_INPUT_DIR" "$WEBSITE_REF" <<'NODE'
          const { createHash } = require('node:crypto');
          const { lstatSync, readdirSync, readFileSync } = require('node:fs');
          const { join, relative } = require('node:path');
          const [releaseDirectory, websiteRef] = process.argv.slice(2);
          const manifest = JSON.parse(readFileSync(join(releaseDirectory, '.release', 'crm-release-manifest.json'), 'utf8'));
          const fail = (message) => { throw new Error(message); };
          if (String(manifest?.source?.commit || '').toLowerCase() !== websiteRef.toLowerCase()) fail('Manifest source commit does not match website_ref.');
          if (manifest?.artifact?.root !== 'dist' || !Array.isArray(manifest?.artifact?.files)) fail('Release manifest has an invalid artifact inventory.');
          const root = join(releaseDirectory, 'dist');
          const expected = new Map(manifest.artifact.files.map((file) => [file.path, file]));
          const actual = new Map();
          const walk = (directory) => {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const absolute = join(directory, entry.name);
              const metadata = lstatSync(absolute);
              if (metadata.isSymbolicLink()) fail(`Artifact contains a symbolic link: ${relative(root, absolute)}`);
              if (metadata.isDirectory()) walk(absolute);
              else if (metadata.isFile()) {
                const path = relative(root, absolute).split(require('node:path').sep).join('/');
                const bytes = readFileSync(absolute);
                actual.set(path, { size: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') });
              } else fail(`Artifact contains an unsupported entry: ${relative(root, absolute)}`);
            }
          };
          walk(root);
          if (actual.size !== expected.size) fail('Artifact file count differs from its manifest.');
          for (const [path, file] of expected) {
            const actualFile = actual.get(path);
            if (!actualFile || actualFile.size !== file.size || actualFile.sha256 !== file.sha256) fail(`Artifact manifest mismatch: ${path}`);
          }
          NODE

      - name: Check out the approved rollback target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: porkbun-huddleway-static
          path: .release/static-target
          fetch-depth: 2
          persist-credentials: true

      - name: Require unchanged rollback target and stage exact artifact
        run: |
          actual="$(git -C "$STATIC_TARGET_DIR" rev-parse HEAD)"
          if [[ "$actual" != "${ROLLBACK_REF,,}" ]]; then
            echo "::error::Production static branch changed after owner approval."
            exit 1
          fi
          sha256sum "$STATIC_TARGET_DIR/admin/index.html" | awk '{print $1}' > .release/rollback-admin-index.sha256
          rsync -a --delete "$RELEASE_INPUT_DIR/dist/" "$STATIC_TARGET_DIR/"
          git -C "$STATIC_TARGET_DIR" add -A
          if git -C "$STATIC_TARGET_DIR" diff --cached --quiet; then
            echo "::error::The exact release artifact produces no static deployment change."
            exit 1
          fi
          sha256sum "$RELEASE_INPUT_DIR/dist/admin/index.html" | awk '{print $1}' > .release/deployed-admin-index.sha256

      - name: Publish the exact artifact
        run: |
          git -C "$STATIC_TARGET_DIR" config user.name "huddleway-release-bot"
          git -C "$STATIC_TARGET_DIR" config user.email "release-bot@users.noreply.github.com"
          git -C "$STATIC_TARGET_DIR" commit \
            -m "Deploy owner-approved CRM ${WEBSITE_REF:0:12}" \
            -m "Release-gate-run: ${RELEASE_RUN_ID}" \
            -m "Rollback-ref: ${ROLLBACK_REF}"
          deployed_commit="$(git -C "$STATIC_TARGET_DIR" rev-parse HEAD)"
          git -C "$STATIC_TARGET_DIR" push origin "HEAD:refs/heads/$DEPLOY_TARGET"
          {
            echo "DEPLOYMENT_PUSHED=true"
            echo "DEPLOYED_COMMIT=$deployed_commit"
          } >> "$GITHUB_ENV"

      - name: Verify the live CRM and backend health
        run: |
          expected="$(cat .release/deployed-admin-index.sha256)"
          for attempt in {1..16}; do
            actual="$(curl --fail --silent --show-error --location "$PRODUCTION_ORIGIN/admin/" | sha256sum | awk '{print $1}')" || actual=""
            if [[ "$actual" == "$expected" ]]; then
              curl --fail --silent --show-error --location "$BACKEND_HEALTH_URL" > /dev/null
              exit 0
            fi
            sleep 10
          done
          echo "::error::The live CRM did not serve the exact deployed admin artifact."
          exit 1

      - name: Roll back automatically after a failed live verification
        if: failure() && env.DEPLOYMENT_PUSHED == 'true'
        run: |
          remote="$(git -C "$STATIC_TARGET_DIR" ls-remote origin "refs/heads/$DEPLOY_TARGET" | awk 'NR == 1 { print $1 }')"
          if [[ "$remote" != "$DEPLOYED_COMMIT" ]]; then
            echo "::error::Production branch changed; refusing automatic rollback."
            exit 1
          fi
          git -C "$STATIC_TARGET_DIR" revert --no-edit "$DEPLOYED_COMMIT"
          git -C "$STATIC_TARGET_DIR" push origin "HEAD:refs/heads/$DEPLOY_TARGET"
          expected="$(cat .release/rollback-admin-index.sha256)"
          for attempt in {1..16}; do
            actual="$(curl --fail --silent --show-error --location "$PRODUCTION_ORIGIN/admin/" | sha256sum | awk '{print $1}')" || actual=""
            if [[ "$actual" == "$expected" ]]; then exit 0; fi
            sleep 10
          done
          echo "::error::Rollback did not restore the prior live admin artifact."
          exit 1

      - name: Record redacted deployment receipt
        if: always()
        run: |
          node -e "const fs=require('node:fs'); fs.mkdirSync('.release',{recursive:true}); fs.writeFileSync('.release/crm-owner-production-deployment.json', JSON.stringify({schemaVersion:1,websiteRef:process.env.WEBSITE_REF,releaseRunId:process.env.RELEASE_RUN_ID,rollbackRef:process.env.ROLLBACK_REF,deployedCommit:process.env.DEPLOYED_COMMIT || null,status:process.env.DEPLOYMENT_PUSHED === 'true' ? 'published_or_rolled_back' : 'not_published'},null,2)+'\\n')"

      - name: Retain deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crm-owner-production-deployment-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: .release/crm-owner-production-deployment.json
