name: CRM production deployment

on:
  workflow_dispatch:
    inputs:
      acceptance_run_id:
        description: Successful CRM production acceptance workflow run ID
        required: true
        type: string
      website_ref:
        description: Full accepted HuddleWaySite commit SHA
        required: true
        type: string
      backend_contract_ref:
        description: Full accepted HuddleWay backend contract commit SHA
        required: true
        type: string
      external_evidence_sha256:
        description: SHA-256 of the privately approved external evidence JSON
        required: true
        type: string
      accepted_archive_sha256:
        description: SHA-256 of crm-production-accepted.tar.gz
        required: true
        type: string
      rollback_ref:
        description: Current porkbun-huddleway-static commit approved for rollback
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: write

concurrency:
  group: porkbun-huddleway-static-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Promote accepted archive without rebuilding
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: crm-production-deployment
      url: https://huddleway.com/admin/
    env:
      HUDDLEWAY_DEPLOY_TARGET: porkbun-huddleway-static
      HUDDLEWAY_PRODUCTION_ORIGIN: https://huddleway.com
      HUDDLEWAY_BACKEND_HEALTH_URL: https://api.huddleway.com/health
      HUDDLEWAY_ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
      HUDDLEWAY_WEBSITE_REF: ${{ inputs.website_ref }}
      HUDDLEWAY_BACKEND_CONTRACT_REF: ${{ inputs.backend_contract_ref }}
      HUDDLEWAY_EXTERNAL_EVIDENCE_SHA256: ${{ inputs.external_evidence_sha256 }}
      HUDDLEWAY_ACCEPTED_ARCHIVE_SHA256: ${{ inputs.accepted_archive_sha256 }}
      HUDDLEWAY_ROLLBACK_REF: ${{ inputs.rollback_ref }}
      ACCEPTED_DOWNLOAD_DIR: ${{ github.workspace }}/.release/download
      STATIC_TARGET_DIR: ${{ github.workspace }}/.release/static-target
      DEPLOYMENT_PLAN_PATH: ${{ github.workspace }}/.release/crm-production-deployment-plan.json
      DEPLOYMENT_RECEIPT_PATH: ${{ github.workspace }}/.release/crm-production-deployment.json
      ROLLBACK_RECEIPT_PATH: ${{ github.workspace }}/.release/crm-production-rollback.json
      DEPLOYMENT_PUSHED: "false"

    steps:
      - name: Require immutable accepted inputs
        run: |
          if [[ ! "$HUDDLEWAY_ACCEPTANCE_RUN_ID" =~ ^[1-9][0-9]{5,19}$ ]]; then
            echo "::error::acceptance_run_id must be a GitHub Actions run ID."
            exit 1
          fi
          for value in \
            "$HUDDLEWAY_WEBSITE_REF" \
            "$HUDDLEWAY_BACKEND_CONTRACT_REF" \
            "$HUDDLEWAY_ROLLBACK_REF"
          do
            if [[ ! "$value" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::Website, backend, and rollback refs must be full commit SHAs."
              exit 1
            fi
          done
          for value in \
            "$HUDDLEWAY_EXTERNAL_EVIDENCE_SHA256" \
            "$HUDDLEWAY_ACCEPTED_ARCHIVE_SHA256"
          do
            if [[ ! "$value" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "::error::Evidence and archive inputs must be SHA-256 digests."
              exit 1
            fi
          done
          if [[ "${GITHUB_SHA,,}" != "${HUDDLEWAY_WEBSITE_REF,,}" ]]; then
            echo "::error::Dispatch this workflow from the exact accepted website commit."
            exit 1
          fi

      - name: Check out the exact accepted deployment implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.website_ref }}
          fetch-depth: 1

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Download the protected accepted artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: crm-production-accepted-${{ inputs.website_ref }}
          path: ${{ env.ACCEPTED_DOWNLOAD_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.acceptance_run_id }}

      - name: Verify archive digest and signed provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$ACCEPTED_DOWNLOAD_DIR/crm-production-accepted.tar.gz"
          checksum_file="$ACCEPTED_DOWNLOAD_DIR/crm-production-accepted.tar.gz.sha256"
          bundle="$ACCEPTED_DOWNLOAD_DIR/crm-production-accepted.attestation.json"
          for path in "$archive" "$checksum_file" "$bundle"; do
            if [[ ! -f "$path" || -L "$path" ]]; then
              echo "::error::Accepted artifact file is missing or unsafe: $path"
              exit 1
            fi
          done
          recorded="$(awk 'NR == 1 { print tolower($1) }' "$checksum_file")"
          if [[ "$recorded" != "${HUDDLEWAY_ACCEPTED_ARCHIVE_SHA256,,}" ]]; then
            echo "::error::Published checksum does not match the approved archive hash."
            exit 1
          fi
          printf '%s  %s\n' \
            "${HUDDLEWAY_ACCEPTED_ARCHIVE_SHA256,,}" \
            "$archive" | sha256sum -c -
          gh attestation verify "$archive" \
            --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow \
              "$GITHUB_REPOSITORY/.github/workflows/crm-production-acceptance.yml" \
            --source-digest "${HUDDLEWAY_WEBSITE_REF,,}" \
            --deny-self-hosted-runners \
            --format json \
            > .release/crm-production-attestation-verification.json

      - name: Check out the exact approved rollback target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: porkbun-huddleway-static
          path: .release/static-target
          fetch-depth: 2
          persist-credentials: true

      - name: Require unchanged production branch
        run: |
          actual="$(git -C "$STATIC_TARGET_DIR" rev-parse HEAD)"
          if [[ "$actual" != "${HUDDLEWAY_ROLLBACK_REF,,}" ]]; then
            echo "::error::Production branch changed after rollback approval."
            exit 1
          fi

      - name: Stage the exact accepted static tree
        run: |
          node scripts/release/crm-production-deploy.mjs stage \
            --archive "$ACCEPTED_DOWNLOAD_DIR/crm-production-accepted.tar.gz" \
            --archive-sha256 "$HUDDLEWAY_ACCEPTED_ARCHIVE_SHA256" \
            --external-evidence-sha256 "$HUDDLEWAY_EXTERNAL_EVIDENCE_SHA256" \
            --website-commit "$HUDDLEWAY_WEBSITE_REF" \
            --backend-commit "$HUDDLEWAY_BACKEND_CONTRACT_REF" \
            --target-directory "$STATIC_TARGET_DIR" \
            --expected-rollback-ref "$HUDDLEWAY_ROLLBACK_REF" \
            --deployment-id "github-run-${GITHUB_RUN_ID}" \
            --out "$DEPLOYMENT_PLAN_PATH"
          git -C "$STATIC_TARGET_DIR" add -A
          if git -C "$STATIC_TARGET_DIR" diff --cached --quiet; then
            echo "::error::Accepted artifact produces no production tree change."
            exit 1
          fi

      - name: Commit and publish the fast-forward deployment
        run: |
          git -C "$STATIC_TARGET_DIR" config user.name "huddleway-release-bot"
          git -C "$STATIC_TARGET_DIR" config user.email "release-bot@users.noreply.github.com"
          git -C "$STATIC_TARGET_DIR" commit \
            -m "Deploy accepted CRM ${HUDDLEWAY_WEBSITE_REF:0:12}" \
            -m "Accepted-archive-sha256: ${HUDDLEWAY_ACCEPTED_ARCHIVE_SHA256,,}" \
            -m "Acceptance-run: ${HUDDLEWAY_ACCEPTANCE_RUN_ID}"
          deployed_commit="$(git -C "$STATIC_TARGET_DIR" rev-parse HEAD)"
          git -C "$STATIC_TARGET_DIR" push \
            origin "HEAD:refs/heads/$HUDDLEWAY_DEPLOY_TARGET"
          {
            echo "HUDDLEWAY_DEPLOYED_COMMIT=$deployed_commit"
            echo "DEPLOYMENT_PUSHED=true"
          } >> "$GITHUB_ENV"
          echo "deployed_commit=$deployed_commit" >> "$GITHUB_OUTPUT"

      - name: Require remote branch to match the deployment
        run: |
          for attempt in {1..10}; do
            remote="$(
              git -C "$STATIC_TARGET_DIR" ls-remote \
                origin "refs/heads/$HUDDLEWAY_DEPLOY_TARGET" |
                awk 'NR == 1 { print $1 }'
            )"
            if [[ "$remote" == "$HUDDLEWAY_DEPLOYED_COMMIT" ]]; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::Remote production branch did not reach the deployment commit."
          exit 1

      - name: Verify live files, routes, CDN policy, and backend health
        run: |
          node scripts/release/crm-production-deploy.mjs verify-live \
            --manifest "$ACCEPTED_DOWNLOAD_DIR/crm-release-manifest.json" \
            --acceptance "$ACCEPTED_DOWNLOAD_DIR/crm-production-acceptance.json" \
            --plan "$DEPLOYMENT_PLAN_PATH" \
            --external-evidence-sha256 "$HUDDLEWAY_EXTERNAL_EVIDENCE_SHA256" \
            --archive-sha256 "$HUDDLEWAY_ACCEPTED_ARCHIVE_SHA256" \
            --deployed-commit "$HUDDLEWAY_DEPLOYED_COMMIT" \
            --origin "$HUDDLEWAY_PRODUCTION_ORIGIN" \
            --backend-health-url "$HUDDLEWAY_BACKEND_HEALTH_URL" \
            --attempts 12 \
            --interval-ms 15000 \
            --out "$DEPLOYMENT_RECEIPT_PATH"

      - name: Roll back automatically when post-deploy verification fails
        if: failure() && env.DEPLOYMENT_PUSHED == 'true'
        run: |
          current="$(git -C "$STATIC_TARGET_DIR" rev-parse HEAD)"
          if [[ "$current" != "$HUDDLEWAY_DEPLOYED_COMMIT" ]]; then
            echo "::error::Local deployment checkout changed; refusing automatic rollback."
            exit 1
          fi
          remote="$(
            git -C "$STATIC_TARGET_DIR" ls-remote \
              origin "refs/heads/$HUDDLEWAY_DEPLOY_TARGET" |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ "$remote" != "$HUDDLEWAY_DEPLOYED_COMMIT" ]]; then
            echo "::error::Remote deployment changed; refusing automatic rollback."
            exit 1
          fi
          git -C "$STATIC_TARGET_DIR" revert --no-edit "$HUDDLEWAY_DEPLOYED_COMMIT"
          rollback_artifact="$(
            node -e \
              "const p=require(process.env.DEPLOYMENT_PLAN_PATH);process.stdout.write(p.rollback.artifactSha256)"
          )"
          node scripts/release/crm-production-deploy.mjs inventory \
            --directory "$STATIC_TARGET_DIR" \
            --expected-sha256 "$rollback_artifact"
          rollback_commit="$(git -C "$STATIC_TARGET_DIR" rev-parse HEAD)"
          git -C "$STATIC_TARGET_DIR" push \
            origin "HEAD:refs/heads/$HUDDLEWAY_DEPLOY_TARGET"
          remote_after="$(
            git -C "$STATIC_TARGET_DIR" ls-remote \
              origin "refs/heads/$HUDDLEWAY_DEPLOY_TARGET" |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ "$remote_after" != "$rollback_commit" ]]; then
            echo "::error::Remote production branch did not accept the rollback commit."
            exit 1
          fi
          node scripts/release/crm-production-deploy.mjs verify-rollback-live \
            --directory "$STATIC_TARGET_DIR" \
            --plan "$DEPLOYMENT_PLAN_PATH" \
            --failed-deployed-commit "$HUDDLEWAY_DEPLOYED_COMMIT" \
            --rollback-commit "$rollback_commit" \
            --origin "$HUDDLEWAY_PRODUCTION_ORIGIN" \
            --backend-health-url "$HUDDLEWAY_BACKEND_HEALTH_URL" \
            --attempts 12 \
            --interval-ms 15000 \
            --out "$ROLLBACK_RECEIPT_PATH"

      - name: Publish successful deployment evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crm-production-deployment-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            .release/crm-production-attestation-verification.json
            .release/crm-production-deployment-plan.json
            .release/crm-production-deployment.json

      - name: Publish failed deployment and rollback evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crm-production-deployment-failure-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            .release/crm-production-attestation-verification.json
            .release/crm-production-deployment-plan.json
            .release/crm-production-rollback.json

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## CRM production deployment"
            echo
            echo "- Website commit: \`${HUDDLEWAY_WEBSITE_REF}\`"
            echo "- Backend commit: \`${HUDDLEWAY_BACKEND_CONTRACT_REF}\`"
            echo "- Accepted archive SHA-256: \`${HUDDLEWAY_ACCEPTED_ARCHIVE_SHA256}\`"
            echo "- Rollback source: \`${HUDDLEWAY_ROLLBACK_REF}\`"
            if [[ -f "$DEPLOYMENT_RECEIPT_PATH" ]]; then
              node -e \
                'const r=require(process.env.DEPLOYMENT_RECEIPT_PATH);console.log("- Deployed commit: `"+r.deployedCommit+"`");console.log("- Deployment receipt: `"+r.deploymentSha256+"`")'
            elif [[ -f "$ROLLBACK_RECEIPT_PATH" ]]; then
              node -e \
                'const r=require(process.env.ROLLBACK_RECEIPT_PATH);console.log("- Automatic rollback commit: `"+r.rollbackCommit+"`");console.log("- Rollback receipt: `"+r.rollbackSha256+"`")'
            else
              echo "- Deployment: not accepted; inspect the failed gate above"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
