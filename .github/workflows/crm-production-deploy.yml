name: CRM single-developer production deployment

on:
  workflow_dispatch:
    inputs:
      website_ref:
        description: Full reviewed HuddleWaySite commit SHA
        required: true
        type: string
      backend_contract_ref:
        description: Full reviewed HuddleWay backend commit SHA
        required: true
        type: string
      release_note:
        description: Short reason for this production deployment
        required: true
        type: string
      consumer_release_id:
        description: Exact deployed production consumer-preview release ID
        required: true
        type: string
      consumer_artifact_sha256:
        description: SHA-256 from the deployed consumer-preview release manifest
        required: true
        type: string
      consumer_rollback_release_id:
        description: Previously accepted production consumer-preview release ID
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: porkbun-huddleway-static-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, publish, and verify CRM
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: crm-production-deployment
      url: https://huddleway.com/admin/
    env:
      HUDDLEWAY_WEBSITE_REF: ${{ inputs.website_ref }}
      HUDDLEWAY_BACKEND_CONTRACT_REF: ${{ inputs.backend_contract_ref }}
      HUDDLEWAY_RELEASE_NOTE: ${{ inputs.release_note }}
      HUDDLEWAY_PRODUCTION_ORIGIN: https://huddleway.com
      HUDDLEWAY_BACKEND_HEALTH_URL: https://api.huddleway.com/health
      STATIC_TARGET_DIR: ${{ github.workspace }}/.release/static-target
      DEPLOYMENT_PLAN_PATH: ${{ github.workspace }}/.release/single-developer-deployment-plan.json
      DEPLOYMENT_RECEIPT_PATH: ${{ github.workspace }}/.release/single-developer-deployment.json
      MY_APP_PARITY_PASSED: "false"

    steps:
      - name: Require exact reviewed commits
        run: |
          for value in "$HUDDLEWAY_WEBSITE_REF" "$HUDDLEWAY_BACKEND_CONTRACT_REF"; do
            if [[ ! "$value" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::Website and backend refs must be full commit SHAs."
              exit 1
            fi
          done
          if [[ "${GITHUB_SHA,,}" != "${HUDDLEWAY_WEBSITE_REF,,}" ]]; then
            echo "::error::Dispatch this workflow from the exact website commit."
            exit 1
          fi

      - name: Check out the reviewed website source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.website_ref }}
          fetch-depth: 1

      - name: Check out the authoritative backend contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: notpac93/HuddleWay
          ref: ${{ inputs.backend_contract_ref }}
          path: .release-input/HuddleWay
          fetch-depth: 1
          token: ${{ secrets.HUDDLEWAY_BACKEND_READ_TOKEN || github.token }}

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up pinned npm
        run: npm install --global npm@11.5.2

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run single-developer release checks
        env:
          HUDDLEWAY_RELEASE_ENVIRONMENT: production-candidate
          HUDDLEWAY_BACKEND_ROOT: ${{ github.workspace }}/.release-input/HuddleWay
          HUDDLEWAY_RELEASE_BACKEND_URL: https://api.huddleway.com
          HUDDLEWAY_RELEASE_FIREBASE_PROJECT_ID: sports-team-apps
          HUDDLEWAY_RELEASE_FIREBASE_USE_EMULATORS: "false"
          HUDDLEWAY_BACKEND_CONTRACT_REF: ${{ inputs.backend_contract_ref }}
          PUBLIC_FIREBASE_PROJECT_ID: sports-team-apps
          PUBLIC_FIREBASE_USE_EMULATORS: "false"
          PUBLIC_FIREBASE_APP_CHECK_ENABLED: "true"
          PUBLIC_FIREBASE_APP_CHECK_SITE_KEY: ${{ secrets.PUBLIC_FIREBASE_APP_CHECK_SITE_KEY }}
          HUDDLEWAY_FIREBASE_APP_CHECK_SITE_KEY_SHA256: ${{ vars.HUDDLEWAY_FIREBASE_APP_CHECK_SITE_KEY_SHA256 }}
          PUBLIC_WEBSITE_COMMIT: ${{ inputs.website_ref }}
          PUBLIC_APP_PREVIEW_ENVIRONMENT: prod
          PUBLIC_APP_PREVIEW_COMMIT: ${{ inputs.backend_contract_ref }}
          PUBLIC_APP_PREVIEW_RELEASE_ID: ${{ inputs.consumer_release_id }}
          HUDDLEWAY_CONSUMER_RELEASE_ID: ${{ inputs.consumer_release_id }}
          HUDDLEWAY_CONSUMER_ARTIFACT_SHA256: ${{ inputs.consumer_artifact_sha256 }}
          HUDDLEWAY_CONSUMER_OWNER: huddleway-app-release
          HUDDLEWAY_CONSUMER_ROLLBACK_RELEASE_ID: ${{ inputs.consumer_rollback_release_id }}
          CI: "true"
        run: |
          npm run test:type
          npm run test:unit
          npm run test:component -- --maxWorkers=1
          npm run build
          npm run check:security
          npm run check:performance

      - name: Check out the current production branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: porkbun-huddleway-static
          path: .release/static-target
          fetch-depth: 1
          persist-credentials: true

      - name: Stage the built static site
        run: |
          node scripts/release/crm-single-developer-deploy.mjs stage \
            --source dist \
            --target "$STATIC_TARGET_DIR" \
            --website-commit "$HUDDLEWAY_WEBSITE_REF" \
            --backend-commit "$HUDDLEWAY_BACKEND_CONTRACT_REF" \
            --release-id "github-run-${GITHUB_RUN_ID}" \
            --out "$DEPLOYMENT_PLAN_PATH"
          git -C "$STATIC_TARGET_DIR" add -A
          git -C "$STATIC_TARGET_DIR" config user.name "huddleway-single-developer"
          git -C "$STATIC_TARGET_DIR" config user.email "single-developer@users.noreply.github.com"
          git -C "$STATIC_TARGET_DIR" commit \
            -m "Deploy CRM ${HUDDLEWAY_WEBSITE_REF:0:12}" \
            -m "Backend: ${HUDDLEWAY_BACKEND_CONTRACT_REF}" \
            -m "Reason: ${HUDDLEWAY_RELEASE_NOTE}"
          echo "HUDDLEWAY_DEPLOYED_COMMIT=$(git -C "$STATIC_TARGET_DIR" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish the production branch
        run: git -C "$STATIC_TARGET_DIR" push origin HEAD:refs/heads/porkbun-huddleway-static

      - name: Verify the published site and backend
        run: |
          node scripts/release/crm-single-developer-deploy.mjs verify-live \
            --origin "$HUDDLEWAY_PRODUCTION_ORIGIN" \
            --backend-health-url "$HUDDLEWAY_BACKEND_HEALTH_URL" \
            --website-commit "$HUDDLEWAY_WEBSITE_REF" \
            --backend-commit "$HUDDLEWAY_BACKEND_CONTRACT_REF" \
            --out "$DEPLOYMENT_RECEIPT_PATH" \
            --attempts 12 \
            --interval-ms 5000

      - name: Require exact production My App parity
        env:
          APP_PREVIEW_EXPECTED_SOURCE_COMMIT: ${{ inputs.backend_contract_ref }}
          APP_PREVIEW_EXPECTED_RELEASE_ID: ${{ inputs.consumer_release_id }}
          APP_PREVIEW_EXPECTED_ARTIFACT_SHA256: ${{ inputs.consumer_artifact_sha256 }}
        run: |
          if npm run test:preview-parity:prod; then
            echo "MY_APP_PARITY_PASSED=true" >> "$GITHUB_ENV"
          else
            echo "::error::Production My App parity failed for the exact approved consumer commit, release, or artifact. The deployment is not accepted."
            exit 1
          fi

      - name: Publish deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crm-single-developer-deployment-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            .release/single-developer-deployment-plan.json
            .release/single-developer-deployment.json

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## CRM single-developer production deployment"
            echo
            echo "- Website commit: \`${HUDDLEWAY_WEBSITE_REF}\`"
            echo "- Backend contract: \`${HUDDLEWAY_BACKEND_CONTRACT_REF}\`"
            echo "- Production commit: \`${HUDDLEWAY_DEPLOYED_COMMIT:-not published}\`"
            echo "- Release note: ${HUDDLEWAY_RELEASE_NOTE}"
            if [[ -f "$DEPLOYMENT_RECEIPT_PATH" ]]; then
              echo "- Live verification: passed"
            else
              echo "- Live verification: failed or not completed"
              echo "- Manual rollback: revert the production commit shown above on porkbun-huddleway-static"
            fi
            if [[ "$MY_APP_PARITY_PASSED" == "true" ]]; then
              echo "- My App parity: passed"
            else
              echo "- My App parity: failed or not completed; this deployment is not accepted"
              echo "- Manual rollback required: revert the production commit shown above"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
