name: CRM production acceptance

on:
  workflow_dispatch:
    inputs:
      website_ref:
        description: Full reviewed HuddleWaySite commit SHA
        required: true
        type: string
      backend_contract_ref:
        description: Full reviewed HuddleWay backend contract commit SHA
        required: true
        type: string
      external_evidence_sha256:
        description: SHA-256 of the privately approved external evidence JSON
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: crm-production-acceptance
  cancel-in-progress: false

jobs:
  accepted-artifact:
    name: Bind external gates to deployable artifact
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: crm-production-acceptance
    env:
      HUDDLEWAY_RELEASE_ENVIRONMENT: production-candidate
      HUDDLEWAY_BACKEND_ROOT: ${{ github.workspace }}/.release-input/HuddleWay
      HUDDLEWAY_BACKEND_CONTRACT_REF: ${{ inputs.backend_contract_ref }}
      HUDDLEWAY_EXTERNAL_EVIDENCE_SHA256: ${{ inputs.external_evidence_sha256 }}
      HUDDLEWAY_RELEASE_BACKEND_URL: https://api.huddleway.com
      HUDDLEWAY_RELEASE_FIREBASE_PROJECT_ID: sports-team-apps
      HUDDLEWAY_RELEASE_FIREBASE_USE_EMULATORS: "false"
      PUBLIC_FIREBASE_APP_CHECK_ENABLED: "true"
      PUBLIC_FIREBASE_APP_CHECK_SITE_KEY: ${{ secrets.PUBLIC_FIREBASE_APP_CHECK_SITE_KEY }}
      PUBLIC_WEBSITE_COMMIT: ${{ inputs.website_ref }}
      HUDDLEWAY_FIREBASE_APP_CHECK_SITE_KEY_SHA256: ${{ vars.HUDDLEWAY_FIREBASE_APP_CHECK_SITE_KEY_SHA256 }}
      CI: "true"

    steps:
      - name: Require immutable revisions and approved evidence hash
        env:
          WEBSITE_REF: ${{ inputs.website_ref }}
        run: |
          if [[ ! "$WEBSITE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::website_ref must be a full reviewed commit SHA."
            exit 1
          fi
          if [[ "${GITHUB_SHA,,}" != "${WEBSITE_REF,,}" ]]; then
            echo "::error::Dispatch this workflow from the exact reviewed website commit."
            exit 1
          fi
          if [[ ! "$HUDDLEWAY_BACKEND_CONTRACT_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::backend_contract_ref must be a full reviewed commit SHA."
            exit 1
          fi
          if [[ ! "$HUDDLEWAY_EXTERNAL_EVIDENCE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::external_evidence_sha256 must be the approved private evidence hash."
            exit 1
          fi

      - name: Check out reviewed website source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.website_ref }}
          fetch-depth: 1

      - name: Verify website checkout
        env:
          WEBSITE_REF: ${{ inputs.website_ref }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "${WEBSITE_REF,,}" ]]; then
            echo "::error::Website checkout does not match website_ref."
            exit 1
          fi

      - name: Check out authoritative backend contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: notpac93/HuddleWay
          ref: ${{ env.HUDDLEWAY_BACKEND_CONTRACT_REF }}
          path: .release-input/HuddleWay
          fetch-depth: 1
          token: ${{ secrets.HUDDLEWAY_BACKEND_READ_TOKEN || github.token }}

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up pinned npm
        run: npm install --global npm@11.5.2

      - name: Install locked dependencies
        run: npm ci

      - name: Require protected release configuration
        run: |
          if [[ -z "$PUBLIC_FIREBASE_APP_CHECK_SITE_KEY" ]]; then
            echo "::error::Configure PUBLIC_FIREBASE_APP_CHECK_SITE_KEY in the protected environment."
            exit 1
          fi
          if [[ ! "$HUDDLEWAY_FIREBASE_APP_CHECK_SITE_KEY_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Configure the approved App Check site-key hash."
            exit 1
          fi
          if [[ -z "${CRM_EXTERNAL_RELEASE_EVIDENCE_JSON:-}" ]]; then
            echo "::error::Configure CRM_EXTERNAL_RELEASE_EVIDENCE_JSON in the protected environment."
            exit 1
          fi
        env:
          CRM_EXTERNAL_RELEASE_EVIDENCE_JSON: ${{ secrets.CRM_EXTERNAL_RELEASE_EVIDENCE_JSON }}

      - name: Build and verify deterministic release candidate
        run: npm run release:ci

      - name: Materialize private external evidence
        env:
          CRM_EXTERNAL_RELEASE_EVIDENCE_JSON: ${{ secrets.CRM_EXTERNAL_RELEASE_EVIDENCE_JSON }}
        run: |
          umask 077
          mkdir -p .release/private
          printf '%s' "$CRM_EXTERNAL_RELEASE_EVIDENCE_JSON" > .release/private/crm-external-evidence.json

      - name: Bind every external gate to the artifact
        run: |
          npm run release:acceptance -- \
            --evidence .release/private/crm-external-evidence.json \
            --expected-sha256 "$HUDDLEWAY_EXTERNAL_EVIDENCE_SHA256"
          npm run release:acceptance:verify -- \
            --expected-sha256 "$HUDDLEWAY_EXTERNAL_EVIDENCE_SHA256"

      - name: Remove private evidence
        if: always()
        run: rm -f .release/private/crm-external-evidence.json

      - name: Package the exact accepted artifact
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          tar \
            --sort=name \
            --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf .release/crm-production-accepted.tar \
            dist \
            .release/crm-release-manifest.json \
            .release/crm-production-acceptance.json
          gzip -n -9 .release/crm-production-accepted.tar
          sha256sum .release/crm-production-accepted.tar.gz \
            > .release/crm-production-accepted.tar.gz.sha256

      - name: Sign build provenance for the accepted archive
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: .release/crm-production-accepted.tar.gz

      - name: Retain the Sigstore attestation bundle
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE_PATH" .release/crm-production-accepted.attestation.json

      - name: Publish accepted archive and redacted receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crm-production-accepted-${{ inputs.website_ref }}
          if-no-files-found: error
          retention-days: 30
          path: |
            .release/crm-production-accepted.tar.gz
            .release/crm-production-accepted.tar.gz.sha256
            .release/crm-production-accepted.attestation.json
            .release/crm-release-manifest.json
            .release/crm-production-acceptance.json

      - name: Publish failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crm-production-acceptance-failure-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            playwright-report/
            test-results/
            .release/crm-release-manifest.json

      - name: Write acceptance summary
        if: always()
        run: |
          {
            echo "## CRM production acceptance"
            echo
            echo "- Website commit: \`${{ inputs.website_ref }}\`"
            echo "- Backend commit: \`${HUDDLEWAY_BACKEND_CONTRACT_REF}\`"
            echo "- External evidence SHA-256: \`${HUDDLEWAY_EXTERNAL_EVIDENCE_SHA256}\`"
            if [[ -f .release/crm-production-acceptance.json ]]; then
              node -e "const a=require('./.release/crm-production-acceptance.json'); console.log('- Artifact SHA-256: \`'+a.release.artifactSha256+'\`'); console.log('- Acceptance SHA-256: \`'+a.acceptanceSha256+'\`')"
              awk '{print "- Accepted archive SHA-256: `"$1"`"}' .release/crm-production-accepted.tar.gz.sha256
              echo "- GitHub attestation: ${{ steps.attest.outputs.attestation-url }}"
            else
              echo "- Acceptance: not produced; inspect the failed gate above"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
